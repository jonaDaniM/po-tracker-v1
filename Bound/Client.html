<script>
  const state = {
    bootstrap: null,
    currentDetail: null,
    admin: null,
    owner: null,
    currentQueue: 'overdue',
    currentImportBatchId: '',
    adminDocuments: {items: [], nextCursor: '', query: '', loading: false},
    adminDocumentDetails: {},
    adminDocumentErrors: {},
    expandedAdminDocuments: {}
  };
  const $ = selector => document.querySelector(selector);
  const $$ = selector => Array.from(document.querySelectorAll(selector));
  const escapeHtml = value => String(value == null ? '' : value).replace(/[&<>"]/g, char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[char]));
  const formatNumber = value => new Intl.NumberFormat(undefined, {maximumFractionDigits: 3}).format(Number(value) || 0);
  const formatDate = value => {
    if (!value) return '-';
    const text = String(value);
    const date = /^\d{4}-\d{2}-\d{2}$/.test(text) ? new Date(Number(text.slice(0, 4)), Number(text.slice(5, 7)) - 1, Number(text.slice(8, 10))) : new Date(value);
    return Number.isNaN(date.getTime()) ? escapeHtml(value) : date.toLocaleDateString();
  };
  const idempotency = prefix => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  
  function callServer(name, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))))[name](...args);
    });
  }
  
  function busy(label) {
    $('#busyLabel').textContent = label || 'Working...';
    $('#busy').hidden = false;
  }
  
  function idle() {
    $('#busy').hidden = true;
  }
  
  function toast(message, error = false) {
    const el = $('#toast');
    el.textContent = message;
    el.className = 'toast show' + (error ? ' error' : '');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.className = 'toast', 4500);
  }
  
  function fail(error) {
    idle();
    toast(error.message || String(error), true);
  }
  
  function openModal(html) {
    $('#modalBody').innerHTML = html;
    $('#modal').hidden = false;
  }
  
  function closeModal() {
    $('#modal').hidden = true;
    $('#modalBody').innerHTML = '';
  }
  
  function lockForm(form, locked) {
    form.dataset.submitting = locked ? 'YES' : '';
    Array.from(form.querySelectorAll('button, input, select, textarea')).forEach(el => el.disabled = locked);
  }
  
  function canAdminEdit() {
    return Boolean(state.bootstrap && state.bootstrap.user && (state.bootstrap.user.canAdminEdit || state.bootstrap.user.canOwnerEdit));
  }
  
  function visibleNumber(record) {
    return record && (record.displayNumber || record.poNumber || record.documentNumber || record.reqNumber || 'PO not assigned');
  }
  
  async function initialize() {
  try {
    busy('Loading PO Tracker...');
    state.bootstrap = await callServer('poBootstrap');
    renderSession();
    idle();

    setTimeout(function () {
      callServer('poRecordAccess').catch(function () {
        // Access telemetry must never interrupt the UI.
      });
    }, 50);
  } catch (error) {
    fail(error);
    $('#searchResults').innerHTML =
      `<article class="panel"><h3>Setup or access required</h3><p>${escapeHtml(error.message)}</p></article>`;
  }
}
  
  function renderSession() {
    const b = state.bootstrap;
    $('#environmentBadge').textContent = `${b.environment} · ${b.transactionMode}`;
    $('#userLabel').textContent = `${b.user.name || b.user.email} · ${b.user.role}`;
    $$('[data-capability="admin"]').forEach(el => el.hidden = !b.user.canAdminManage);
    $$('[data-capability="owner"]').forEach(el => el.hidden = !b.user.canOwnerEdit);
    $$('.admin-edit-only').forEach(el => el.hidden = !canAdminEdit());
  }
  
  function switchView(name) {
    $$('.view').forEach(el => el.classList.toggle('active', el.id === `view-${name}`));
    $$('.nav button').forEach(el => el.classList.toggle('active', el.dataset.view === name));
    if (name === 'admin' && !state.admin) loadAdmin();
    if (name === 'owner' && !state.owner) loadOwner();
  }
  
  async function runSearch(event) {
    event.preventDefault();
    const query = $('#searchInput').value.trim();
    if (!query) return;
    try {
      busy('Searching...');
      const result = await callServer('poSearch', query);
      renderSearch(result.results);
      $('#orderDetail').innerHTML = '';
      idle();
    } catch (error) {
      fail(error);
    }
  }
  
  function renderSearch(results) {
    $('#searchResults').innerHTML = !results.length ? '<article class="panel">No matching procurement records.</article>' : results.map(item => `
      <article class="result-card">
        <div>
          <h3>PO ${escapeHtml(visibleNumber(item))}</h3>
          <div class="meta">${item.reqNumber ? `Req ${escapeHtml(item.reqNumber)} · ` : ''}${escapeHtml(item.documentType)} · ${escapeHtml(item.branchPlant || 'No branch')} · ${formatNumber(item.totalLines)} line(s)</div>
          <div class="meta">Ordered ${formatNumber(item.quantityOrdered)} · Open ${formatNumber(item.quantityOpen)} · Status <span class="status-${escapeHtml(item.status)}">${escapeHtml(item.status)}</span></div>
        </div>
        <button data-open-order="${escapeHtml(item.id)}">Open</button>
      </article>`).join('');
  }
  
  async function openOrder(id) {
  try {
    busy('Loading order...');

    const canViewLineNotes = Boolean(
      state.bootstrap &&
      state.bootstrap.user &&
      (
        state.bootstrap.user.canAdminManage ||
        state.bootstrap.user.canOwnerEdit
      )
    );

    state.currentDetail = await callServer(
      'poDetail',
      id,
      canViewLineNotes ? {includeNotes: false} : {}
    );

    renderDetail();
    idle();

    if (canViewLineNotes) {
      loadCurrentDetailNotes(id);
    }
  } catch (error) {
    fail(error);
  }
}

  function quantity(label, value) {
    return `<div class="quantity"><strong>${formatNumber(value)}</strong><span>${escapeHtml(label)}</span></div>`;
  }
  
  function renderDetail() {
    const d = state.currentDetail;
    if (!d) return;
    const editable = canAdminEdit();
    const adminOrderActions = editable && d.lines.length
      ? `<div class="button-row" style="margin-top:12px"><button data-edit-req="${escapeHtml(d.id)}">Edit Req / PO</button><button data-promised-order="${escapeHtml(d.id)}">Set promised date for req</button><button data-add-req-line="${escapeHtml(d.id)}">Add item</button><button class="danger" data-delete-req="${escapeHtml(d.id)}">Delete req</button></div>`
      : '';
    const reqMeta = d.reqNumber ? `Req ${escapeHtml(d.reqNumber)} · ` : '';
    const poMeta = d.poNumbers && d.poNumbers.length > 1 ? `POs ${escapeHtml(d.poNumbers.join(', '))}` : `PO ${escapeHtml(d.poNumber || visibleNumber(d))}`;
    const header = `
      <article class="panel">
        <p class="eyebrow">ORDER DETAIL</p>
        <h2>${poMeta}</h2>
        <p class="meta">${reqMeta}${escapeHtml(d.cloudDriveName || '')}</p>
        <p class="meta">${escapeHtml(d.shipToAddress || 'No ship-to address')} · Requested ${formatDate(d.requestedDate)} · Imported delivery ${formatDate(d.importedDeliveryDate)}</p>
        <div class="quantity-grid">${quantity('Ordered', d.quantityOrdered)}${quantity('Good received', d.quantityReceivedGood)}${quantity('Open', d.quantityOpen)}${quantity('Damaged', d.quantityDamaged)}${quantity('Incorrect', d.quantityIncorrect)}${quantity('Backordered', d.quantityVendorBackordered)}</div>
        ${adminOrderActions}
      </article>`;
  
    const lines = d.lines.map(line => {
      const fieldActions = state.bootstrap.user.canFieldTransact && line.quantityOpen > 0
        ? `<button data-receive="HERE" data-line="${escapeHtml(line.id)}">Here</button><button data-receive="DAMAGED" data-line="${escapeHtml(line.id)}">Damaged</button><button data-receive="INCORRECT_ITEM" data-line="${escapeHtml(line.id)}">Incorrect item</button><button data-receive="NOT_HERE" data-line="${escapeHtml(line.id)}" ${line.canReportNotHere ? '' : 'disabled title="Available on or after the promised date"'}>Not here</button>`
        : '';
      const adminActions = editable
        ? `<button data-promised="${escapeHtml(line.id)}">Set promised date</button>${line.quantityOpen > 0 ? `<button data-backorder="${escapeHtml(line.id)}">Confirm backorder</button>` : ''}`
        : '';
      const lineNumberMeta = line.reqNumber ? `Req ${escapeHtml(line.reqNumber)} · ` : '';
      const lineNotes = line.notesError
        ? '<span class="error-text">Notes unavailable</span>'
        : (
          line.notesLoaded === false
            ? '<span class="meta">Loading notes...</span>'
            : renderLineNotes(line)
          );
      return `
        <article class="line-card">
          <div class="section-heading">
            <div>
              <h4>PO ${escapeHtml(line.poNumber || visibleNumber(d))} · line ${escapeHtml(line.lineNumber)} · ${escapeHtml(line.description)}</h4>
              <div class="meta">${lineNumberMeta}${escapeHtml(line.uom)} · Job ${escapeHtml(line.jobNumber || '-')} · Account ${escapeHtml(line.accountNumber || '-')}${line.manualItem ? ' · Manual item' : ''}</div>
            </div>
            <div class="chip-row">
              <span class="chip status-${escapeHtml(line.status)}">${escapeHtml(line.status)}</span>
              ${line.quantityDamaged > 0 ? '<span class="chip status-DAMAGED">DAMAGED</span>' : ''}
              ${line.quantityIncorrect > 0 ? '<span class="chip status-INCORRECT_ITEM">INCORRECT ITEM</span>' : ''}
              ${line.quantityNotHere > 0 ? '<span class="chip status-OVERDUE">NOT HERE</span>' : ''}
              ${line.quantityVendorBackordered > 0 ? '<span class="chip status-VENDOR_BACKORDER">VENDOR BACKORDER</span>' : ''}
            </div>
          </div>
          <div class="quantity-grid">${quantity('Ordered', line.quantityOrdered)}${quantity('Good', line.quantityReceivedGood)}${quantity('Open', line.quantityOpen)}${quantity('Damaged', line.quantityDamaged)}${quantity('Incorrect', line.quantityIncorrect)}${quantity('Not here', line.quantityNotHere)}${quantity('Vendor BO', line.quantityVendorBackordered)}</div>
          <div class="meta">Promised: ${formatDate(line.promisedDate)}</div>
          ${lineNotes ? `<div class="line-card-notes">${lineNotes}</div>` : ''}
          <div class="button-row" style="margin-top:12px">${fieldActions}${adminActions}</div>
        </article>`;
    }).join('');
  
    const docs = d.documents && d.documents.length ? `<article class="panel"><h3>Documents</h3>${d.documents.map(doc => `<a href="${escapeHtml(doc.url)}" target="_blank" rel="noopener">${escapeHtml(doc.role)} · ${escapeHtml(doc.fileName)}</a>`).join('<br>')}</article>` : '';
    $('#orderDetail').innerHTML = header + renderHeaderNote(d) + lines + docs;
    $('#orderDetail').scrollIntoView({behavior: 'smooth', block: 'start'});
  }
  
  function formatNoteDateTime(value) {
    if (!value) return '';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
  }
  
  function lineNoteMeta(note) {
    const parts = [];
    const source = String(note && note.source || '').toUpperCase();
    if (source) parts.push(source === 'FIELD' ? 'Field' : 'Admin');
    if (note && note.type) parts.push(String(note.type).replace(/_/g, ' '));
    if (note && Number(note.quantity) > 0) {
      parts.push(formatNumber(note.quantity) + (note.uom ? ` ${String(note.uom)}` : ''));
    }
    const actor = note && (note.createdByName || note.createdByEmail);
    if (actor) parts.push(`By ${String(actor)}`);
    if (note && note.createdAt) parts.push(formatNoteDateTime(note.createdAt));
    return escapeHtml(parts.join(' · '));
  }
  
  function renderLineNotes(line) {
    const notes = Array.isArray(line && line.notes) ? line.notes : [];
    const count = Number(line && (line.noteCount || notes.length)) || 0;
    if (!count || !notes.length) return '';
    return `
      <details class="po-line-notes">
        <summary>
          <span>Notes</span>
          <span class="po-line-note-count">${escapeHtml(count)}</span>
        </summary>
        <div class="po-line-note-list">
          ${notes.map(note => `
            <article class="po-line-note">
              <div class="po-line-note-meta">${lineNoteMeta(note)}</div>
              <div class="po-line-note-text">${escapeHtml(note.text || '')}</div>
            </article>`).join('')}
          ${line.notesTruncated ? `<div class="po-line-note-truncated">Showing newest ${escapeHtml(notes.length)} of ${escapeHtml(count)} notes.</div>` : ''}
        </div>
      </details>`;
  }
  
  function renderLineNotesCell(line) {
  if (line && line.notesError) {
    return '<span class="error-text">Notes unavailable</span>';
  }

  if (line && line.notesLoaded === false) {
    return '<span class="meta">Loading notes...</span>';
  }

  return renderLineNotes(line) || '<span class="meta">—</span>';
}

function mergeLineNotePayloadIntoDetail(detail, payload) {
  if (!detail || !Array.isArray(detail.lines)) return detail;

  const byId = {};
  ((payload && payload.lines) || []).forEach(function (item) {
    if (item && item.id) byId[item.id] = item;
  });

  detail.lines.forEach(function (line) {
    const incoming = byId[line.id] || {
      noteCount: 0,
      notesTruncated: false,
      notes: []
    };

    let notes = Array.isArray(incoming.notes)
      ? incoming.notes.slice()
      : [];

    let count = Number(incoming.noteCount || notes.length) || 0;

    if (!count && line.adminNotes) {
      notes = [{
        id: 'LEGACY-CURRENT-' + line.id,
        source: 'ADMIN',
        type: 'CURRENT_ADMIN_NOTE',
        text: line.adminNotes,
        quantity: 0,
        uom: '',
        createdByName: '',
        createdByEmail: '',
        createdAt: ''
      }];
      count = 1;
    }

    line.noteCount = count;
    line.notesTruncated = Boolean(incoming.notesTruncated);
    line.notes = notes;
    line.notesLoaded = true;
    line.notesError = '';
  });

  detail.notesLoaded = true;
  return detail;
}

function markDetailNotesError(detail, message) {
  if (!detail || !Array.isArray(detail.lines)) return;

  detail.lines.forEach(function (line) {
    line.notesLoaded = true;
    line.notesError = message || 'Notes could not be loaded.';
  });
}

async function loadCurrentDetailNotes(procurementId) {
  const detail = state.currentDetail;
  if (!detail || detail.id !== procurementId) return;

  try {
    const payload = await callServer(
      'poLineNotes',
      procurementId,
      detail.lines.map(function (line) { return line.id; })
    );

    if (!state.currentDetail || state.currentDetail.id !== procurementId) return;

    mergeLineNotePayloadIntoDetail(state.currentDetail, payload);
    renderDetail();
  } catch (error) {
    if (!state.currentDetail || state.currentDetail.id !== procurementId) return;

    markDetailNotesError(
      state.currentDetail,
      error.message || String(error)
    );

    renderDetail();
    toast('Order loaded, but note history could not be loaded.', true);
  }
}

async function loadAdminDocumentNotes(procurementId) {
  const detail = state.adminDocumentDetails[procurementId];
  if (!detail) return;

  try {
    const payload = await callServer(
      'poLineNotes',
      procurementId,
      detail.lines.map(function (line) { return line.id; })
    );

    const current = state.adminDocumentDetails[procurementId];
    if (!current) return;

    mergeLineNotePayloadIntoDetail(current, payload);
    renderAdminDocuments();
  } catch (error) {
    const current = state.adminDocumentDetails[procurementId];
    if (!current) return;

    markDetailNotesError(
      current,
      error.message || String(error)
    );

    renderAdminDocuments();
    toast('Lines loaded, but note history could not be loaded.', true);
  }
}
  
  function renderHeaderNote(detail) {
    const text = detail && detail.headerAdminNotes ? String(detail.headerAdminNotes).trim() : '';
    if (!text) return '';
    return `<div class="req-note"><strong>Latest req note</strong><div>${escapeHtml(text)}</div></div>`;
  }
  
  
    
  async function refreshCurrentDetailAndAdmin() {
    if (state.currentDetail) {
      state.currentDetail = await callServer('poDetail', state.currentDetail.id);
      renderDetail();
    }
    if (state.admin) {
      state.admin = await callServer('poAdminDashboard');
      renderAdmin();
    }
  }
  
  function receiveModal(action, lineId) {
    const notesRequired = action !== 'HERE';
    const requestKey = idempotency(action);
    openModal(`<h3>${escapeHtml(action.replace('_', ' '))}</h3><form id="receiveForm" class="form-grid"><input id="receiveQuantity" type="number" min="0.001" step="any" placeholder="Quantity" required><textarea id="receiveNotes" placeholder="Notes${notesRequired ? ' (required)' : ''}" ${notesRequired ? 'required' : ''}></textarea><button class="primary">Confirm</button></form>`);
    $('#receiveForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      if (form.dataset.submitting === 'YES') return;
      try {
        lockForm(form, true);
        busy('Recording action...');
        const result = await callServer('poReceive', {action, lineId, quantity: Number($('#receiveQuantity').value), notes: $('#receiveNotes').value, idempotencyKey: requestKey});
        state.currentDetail = result.detail;
        closeModal();
        renderDetail();
        idle();
        toast(result.idempotentReplay ? 'Request was already recorded; showing current order.' : 'Material action recorded.');
      } catch (error) {
        lockForm(form, false);
        fail(error);
      }
    });
  }
  
  function promisedModal(lineId) {
    openModal(`<h3>Set promised date</h3><form id="promisedForm" class="form-grid"><input id="promisedDate" type="date" required><button class="primary">Save</button></form>`);
    $('#promisedForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      if (form.dataset.submitting === 'YES') return;
      try {
        lockForm(form, true);
        busy('Saving promised date...');
        await callServer('poSavePromisedDates', [{lineId, promisedDate: $('#promisedDate').value}]);
        await refreshCurrentDetailAndAdmin();
        closeModal();
        idle();
        toast('Promised date updated.');
      } catch (error) {
        lockForm(form, false);
        fail(error);
      }
    });
  }
  
  function promisedOrderModal(procurementId) {
    const detail = state.currentDetail;
    const lineIds = detail && detail.id === procurementId ? detail.lines.map(line => line.id) : [];
    if (!lineIds.length) return toast('Open the requisition before applying a req promised date.', true);
    openModal(`<h3>Set promised date for req</h3><p class="meta">Applies to ${lineIds.length} line(s) on ${escapeHtml(detail.documentNumber)}.</p><form id="promisedOrderForm" class="form-grid"><input id="promisedOrderDate" type="date" required><button class="primary">Apply to req</button></form>`);
    $('#promisedOrderForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      if (form.dataset.submitting === 'YES') return;
      try {
        lockForm(form, true);
        busy('Applying req promised date...');
        const promisedDate = $('#promisedOrderDate').value;
        const result = await callServer('poSaveReqPromisedDate', procurementId, promisedDate);
        await refreshCurrentDetailAndAdmin();
        closeModal();
        idle();
        toast(`Updated ${result.updatedCount || lineIds.length} promised date(s).`);
      } catch (error) {
        lockForm(form, false);
        fail(error);
      }
    });
  }
  
  function backorderModal(lineId) {
    const requestKey = idempotency('BO');
    openModal(`<h3>Confirm vendor backorder</h3><form id="backorderForm" class="form-grid"><input id="boQuantity" type="number" min="0.001" step="any" placeholder="Quantity" required><input id="boVendor" placeholder="Vendor name" required><label>Vendor confirmation date<input id="boConfirmDate" type="date" required></label><label>Revised promised date<input id="boPromiseDate" type="date" required></label><input id="boReference" placeholder="Vendor reference (optional)"><textarea id="boNotes" placeholder="Admin notes (optional)"></textarea><button class="primary">Confirm backorder</button></form>`);
    $('#backorderForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      if (form.dataset.submitting === 'YES') return;
      try {
        lockForm(form, true);
        busy('Confirming backorder...');
        const result = await callServer('poConfirmBackorder', {lineId, quantity: Number($('#boQuantity').value), vendorName: $('#boVendor').value, vendorConfirmationDate: $('#boConfirmDate').value, revisedPromisedDate: $('#boPromiseDate').value, vendorReference: $('#boReference').value, notes: $('#boNotes').value, idempotencyKey: requestKey});
        state.currentDetail = result.detail;
        closeModal();
        renderDetail();
        idle();
        toast(result.idempotentReplay ? 'Backorder was already recorded; showing current order.' : 'Vendor backorder confirmed.');
      } catch (error) {
        lockForm(form, false);
        fail(error);
      }
    });
  }
  
  async function loadAdmin() {
    try {
      busy('Loading admin dashboard...');
      state.admin = await callServer('poAdminDashboard');
      renderAdmin();
      idle();
      loadAdminDocuments(true);
    } catch (error) {
      fail(error);
    }
  }
  
  function renderAdmin() {
    const k = state.admin.kpis;
    $('#adminKpis').innerHTML = Object.entries({Documents: k.documents, Lines: k.lines, Ordered: k.quantityOrdered, Received: k.quantityReceived, Open: k.quantityOpen, Overdue: k.overdue, Incorrect: k.incorrectItem}).map(([label, value]) => `<div class="kpi"><strong>${formatNumber(value)}</strong><span>${label}</span></div>`).join('');
    const labels = {missingDate: 'Missing dates', dueToday: 'Due today', overdue: 'Overdue', damaged: 'Damaged', incorrectItem: 'Incorrect item', vendorBackorder: 'Vendor BO'};
    $('#queueTabs').innerHTML = Object.entries(labels).map(([key, label]) => `<button class="chip" data-queue="${key}">${label} (${(state.admin.queues[key] || []).length})</button>`).join('');
    renderQueue();
  }
  
  function renderQueue() {
    const items = state.admin.queues[state.currentQueue] || [];
    const bulk = state.currentQueue === 'missingDate' && items.length && canAdminEdit() ? `<div class="list-row"><strong>Bulk promised date</strong><div class="search-row"><input id="bulkPromisedDate" type="date"><button data-bulk-promised>Apply to selected</button></div></div>` : '';
    $('#queueList').innerHTML = bulk + (items.length ? items.map(line => `
      <div class="list-row">
        ${state.currentQueue === 'missingDate' && canAdminEdit() ? `<label><input type="checkbox" data-bulk-line="${escapeHtml(line.id)}"> Select</label>` : ''}
        <strong>PO ${escapeHtml(line.poNumber || line.documentNumber || '-')} · line ${escapeHtml(line.lineNumber)}</strong>
        <div>${escapeHtml(line.description)}</div>
        <div class="meta">${line.reqNumber ? `Req ${escapeHtml(line.reqNumber)} · ` : ''}Open ${formatNumber(line.quantityOpen)} ${escapeHtml(line.uom)} · promised ${formatDate(line.promisedDate)}</div>
        <button data-open-line-order="${escapeHtml(line.procurementId)}">Open order</button>
      </div>`).join('') : '<p class="meta">Queue is clear.</p>');
  }
  
  function resetAdminDocuments(query) {
    state.adminDocuments = {items: [], nextCursor: '', query: normalizeQuery(query), loading: false};
    state.adminDocumentErrors = {};
    state.expandedAdminDocuments = {};
    renderAdminDocuments();
  }
  
  function normalizeQuery(value) {
    return String(value == null ? '' : value).trim();
  }
  
  async function loadAdminDocuments(reset = false) {
    const input = $('#adminDocumentSearch');
    const nextQuery = reset ? normalizeQuery(input && input.value) : state.adminDocuments.query;
    if (reset) resetAdminDocuments(nextQuery);
    if (state.adminDocuments.loading) return;
    state.adminDocuments.loading = true;
    renderAdminDocuments();
    try {
      const result = await callServer('poAdminDocuments', {
        query: state.adminDocuments.query,
        cursor: reset ? '' : state.adminDocuments.nextCursor,
        pageSize: 20
      });
      state.adminDocuments.items = reset ? result.documents : state.adminDocuments.items.concat(result.documents);
      state.adminDocuments.nextCursor = result.nextCursor || '';
      state.adminDocuments.loading = false;
      renderAdminDocuments();
    } catch (error) {
      state.adminDocuments.loading = false;
      $('#adminDocumentsList').innerHTML = `<p class="error-text">Documents failed to load: ${escapeHtml(error.message || String(error))}</p>`;
      $('#adminDocumentsPager').hidden = true;
      fail(error);
    }
  }
  
  function renderAdminDocuments() {
    const list = $('#adminDocumentsList');
    if (!list) return;
    const docs = state.adminDocuments.items;
    if (!docs.length && state.adminDocuments.loading) {
      list.innerHTML = '<p class="meta">Loading documents...</p>';
    } else if (!docs.length) {
      list.innerHTML = '<p class="meta">No documents found.</p>';
    } else {
      list.innerHTML = docs.map(renderAdminDocumentCard).join('');
    }

  async function toggleAdminDocument(procurementId) {
  if (state.expandedAdminDocuments[procurementId]) {
    delete state.expandedAdminDocuments[procurementId];
    renderAdminDocuments();
    return;
  }

  state.expandedAdminDocuments[procurementId] = true;
  renderAdminDocuments();

  if (state.adminDocumentDetails[procurementId]) return;

  try {
    state.adminDocumentDetails[procurementId] = await callServer(
      'poDetail',
      procurementId,
      {
        includeNotes: false,
        includeDocuments: false
      }
    );

    delete state.adminDocumentErrors[procurementId];
    renderAdminDocuments();

    loadAdminDocumentNotes(procurementId);
  } catch (error) {
    state.adminDocumentErrors[procurementId] =
      error.message || String(error);

    renderAdminDocuments();
    fail(error);
  }
}

  async function startImport() {
    const files = Array.from($('#importFiles').files || []);
    if (!files.length) return toast('Choose one or more .xls/.xlsx files.', true);
    if (files.some(file => file.size > 8 * 1024 * 1024)) return toast('Each file must be 8 MB or smaller.', true);
    try {
      busy('Creating import batch...');
      $('#importProgress').textContent = 'Preparing import batch...';
      const batch = await callServer('poCreateImportBatch', $('#importNotes').value);
      state.currentImportBatchId = batch.batchId;
      for (let index = 0; index < files.length; index += 1) {
        const file = files[index];
        $('#importProgress').textContent = `Uploading ${index + 1} of ${files.length}: ${file.name}`;
        const data = await readFileBase64(file);
        await callServer('poUploadImportFile', {batchId: batch.batchId, fileName: file.name, mimeType: file.type || mimeFor(file.name), sizeBytes: file.size, base64Data: data, modifiedAt: new Date(file.lastModified).toISOString()});
      }
      const review = await callServer('poImportBatch', batch.batchId);
      renderImportReview(review);
      $('#importFiles').value = '';
      idle();
      toast('Import batch staged for review.');
    } catch (error) {
      $('#importProgress').innerHTML = `<p class="error-text">Upload failed: ${escapeHtml(error.message || String(error))}</p>`;
      fail(error);
    }
  }
  
  function readFileBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error);
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.readAsDataURL(file);
    });
  }
  
  function mimeFor(name) {
    return name.toLowerCase().endsWith('.xls') ? 'application/vnd.ms-excel' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  }
  
  function renderImportReview(batch) {
    state.currentImportBatchId = batch.batchId;

    try {
      busy('Creating backup...');
      const result = await callServer('poCreateBackup', 'Manual backup from Owner interface.');
      idle();
      toast(`Backup completed: ${result.fileName}`);
    } catch (error) {
      fail(error);
    }
  }
  
  async function runHealth() {
    try {
      busy('Running diagnostics...');
      const result = await callServer('poRunHealth');
      $('#healthResult').textContent = JSON.stringify(result, null, 2);
      idle();
      toast(`Health check: ${result.status}`);
    } catch (error) {
      fail(error);
    }
  }
  
  async function migrateSchema() {
    try {
      busy('Migrating schema...');
      const result = await callServer('poMigrateSchema');
      $('#healthResult').textContent = JSON.stringify(result, null, 2);
      state.owner = null;
      await loadOwner();
      idle();
      toast('Schema migration complete.');
    } catch (error) {
      fail(error);
    }
  }
  
  async function previewCorrection() {
    try {
      busy('Building correction preview...');
      const preview = await callServer('poPreviewCorrection', $('#correctionTransaction').value, $('#correctionReason').value);
      $('#correctionPreview').innerHTML = `<div class="list-row"><strong>Verification: ${escapeHtml(preview.verificationCode)}</strong><p>${escapeHtml(preview.warning)}</p><button class="danger" data-apply-correction="${escapeHtml(preview.correctionId)}" data-code="${escapeHtml(preview.verificationCode)}">Apply compensating correction</button></div>`;
      state.owner = null;
      await loadOwner();
      idle();
    } catch (error) {
      fail(error);
    }
  }
  
  async function applyCorrection(id, code) {
    if (!window.confirm('Apply this compensating correction? A backup will be created first.')) return;
    try {
      busy('Backing up and applying correction...');
      await callServer('poApplyCorrection', id, code);
      $('#correctionPreview').innerHTML = '';
      state.owner = null;
      await loadOwner();
      idle();
      toast('Compensating correction applied.');
    } catch (error) {
      fail(error);
    }
  }
  
  document.addEventListener('click', event => {
    const target = event.target.closest('button');
    if (!target) return;
    if (target.dataset.view) switchView(target.dataset.view);
    if (target.dataset.openOrder) openOrder(target.dataset.openOrder);
    if (target.dataset.openLineOrder) { switchView('field'); openOrder(target.dataset.openLineOrder); }
    if (target.dataset.receive) receiveModal(target.dataset.receive, target.dataset.line);
    if (target.dataset.promised) promisedModal(target.dataset.promised);
    if (target.dataset.promisedOrder) promisedOrderModal(target.dataset.promisedOrder);
    if (target.dataset.backorder) backorderModal(target.dataset.backorder);
    if (target.dataset.queue) { state.currentQueue = target.dataset.queue; renderQueue(); }
    if (Object.prototype.hasOwnProperty.call(target.dataset, 'bulkPromised')) applyBulkPromised();
    if (target.dataset.toggleAdminDocument) toggleAdminDocument(target.dataset.toggleAdminDocument);
    if (target.dataset.editReq) editReqModal(target.dataset.editReq);
    if (target.dataset.assignSelectedPo) assignSelectedPoModal(target.dataset.assignSelectedPo);
    if (target.dataset.addReqLine) addReqLineModal(target.dataset.addReqLine);
    if (target.dataset.deleteSelectedLines) deleteSelectedLinesModal(target.dataset.deleteSelectedLines);
    if (target.dataset.deleteReq) deleteReqModal(target.dataset.deleteReq);
    if (target.dataset.addSelectedNote) addSelectedLineNoteModal(target.dataset.addSelectedNote);
    if (target.dataset.reviewStaging) reviewStaging(target.dataset.reviewStaging);
    if (target.dataset.publish) publishStaging(target.dataset.publish, true, target);
    if (target.dataset.saveSetting) saveSetting(target.dataset.saveSetting);
    if (target.dataset.correctTransaction) selectCorrectionTransaction(target.dataset.correctTransaction);
    if (target.dataset.applyCorrection) applyCorrection(target.dataset.applyCorrection, target.dataset.code);
  });
  
  $('#searchForm').addEventListener('submit', runSearch);
  $('#closeModal').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', event => { if (event.target.id === 'modal') closeModal(); });
  $('#refreshAdmin').addEventListener('click', loadAdmin);
  $('#refreshAdminDocuments').addEventListener('click', () => loadAdminDocuments(true));
  $('#adminDocumentSearchForm').addEventListener('submit', searchAdminDocuments);
  $('#clearAdminDocumentSearch').addEventListener('click', clearAdminDocumentSearch);
  $('#loadMoreAdminDocuments').addEventListener('click', () => loadAdminDocuments(false));
  $('#startImport').addEventListener('click', startImport);
  $('#clearImportFiles').addEventListener('click', clearImportFiles);
  $('#refreshOwner').addEventListener('click', loadOwner);
  $('#userForm').addEventListener('submit', saveUser);
  $('#createBackup').addEventListener('click', createBackup);
  $('#migrateSchema').addEventListener('click', migrateSchema);
  $('#runHealth').addEventListener('click', runHealth);
  $('#previewCorrection').addEventListener('click', previewCorrection);
  initialize();
  </script>
